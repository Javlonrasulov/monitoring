logLevel: info

api: no
metrics: no
pprof: no
playback: no

rtsp: yes
rtspAddress: :8554
rtspTransports: [tcp]
rtmp: no
hls: no
srt: no

webrtc: yes
webrtcAddress: :8889
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: ''
# Docker only sees container/loopback IPs; force the public VDS address into ICE.
webrtcIPsFromInterfaces: no
webrtcAdditionalHosts: [89.39.95.41]
webrtcICEServers2:
  - url: stun:stun.l.google.com:19302

# Every publish/read is authorized by the API against short-lived stream tokens.
authMethod: http
authHTTPAddress: http://api:3001/api/v1/streaming/mediamtx-auth

pathDefaults:
  source: publisher
  # After reboot / force-stop the old WHIP session can linger. Let the
  # new publisher take the same device path instead of failing.
  overridePublisher: true

# Device paths are dynamic (device/<uuid>), so any path name must be accepted.
paths:
  all_others:

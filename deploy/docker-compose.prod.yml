name: monitor

services:
  postgres:
    image: postgres:16-alpine
    container_name: monitor_postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 224m
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: monitor_redis
    command: ['redis-server', '--save', '""', '--appendonly', 'no', '--maxmemory', '24mb', '--maxmemory-policy', 'allkeys-lru']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 48m
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
      target: runner
    image: monitor-api:latest
    container_name: monitor_api
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?schema=public
      REDIS_URL: redis://redis:6379
      RECORDINGS_DIR: /recordings
      MEDIAMTX_RTSP_BASE: rtsp://mediamtx:8554
    volumes:
      - uploads:/app/uploads
      - recordings:/recordings
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 400m
    restart: unless-stopped

  admin:
    build:
      context: ..
      dockerfile: deploy/admin-web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_BASE_URL}/api/v1
        NEXT_PUBLIC_WS_URL: ${PUBLIC_BASE_URL}/realtime
    image: monitor-admin:latest
    container_name: monitor_admin
    depends_on:
      - api
    mem_limit: 224m
    restart: unless-stopped

  user:
    build:
      context: ..
      dockerfile: deploy/user-web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_BASE_URL}/api/v1
        NEXT_PUBLIC_WS_URL: ${PUBLIC_BASE_URL}/realtime
        NEXT_PUBLIC_CHAT_WS_URL: ${PUBLIC_BASE_URL}/chat
    image: monitor-user:latest
    container_name: monitor_user
    depends_on:
      - api
    mem_limit: 224m
    restart: unless-stopped

  mediamtx:
    image: bluenviron/mediamtx:1.11.3
    container_name: monitor_mediamtx
    environment:
      MTX_WEBRTCADDITIONALHOSTS: ${PUBLIC_HOST}
    ports:
      - '${MEDIAMTX_UDP_PORT}:8189/udp'
    volumes:
      - ./mediamtx.prod.yml:/mediamtx.yml:ro
    depends_on:
      - api
    mem_limit: 192m
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: monitor_nginx
    ports:
      - '127.0.0.1:${HTTP_PORT}:80'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./public:/usr/share/nginx/html:ro
    depends_on:
      - api
      - admin
      - user
    mem_limit: 48m
    restart: unless-stopped

  # One-off helper: docker compose --profile tools run --rm migrate
  migrate:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
      target: builder
    image: monitor-api-tools:latest
    container_name: monitor_migrate
    profiles: ['tools']
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?schema=public
    command: ['sh', '-c', 'npx prisma migrate deploy && npm run prisma:seed']
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 320m
    restart: 'no'

volumes:
  pgdata:
  uploads:
  recordings:
